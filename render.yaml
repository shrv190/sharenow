services:
  - type: web
    name: sharenow
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    envVars:
      - key: SHARENOW_MAX_STORAGE_MB
        value: "500"
      - key: SHARENOW_TTL_SECONDS
        value: "3600"
      - key: PYTHON_VERSION
        value: "3.11.9"

